name: "Attest builds"

on:
  workflow_call:
    # needed since it allows this to become a reusable workflow
  workflow_dispatch:
    # allows manual trigger

permissions:
  contents: "write"
  id-token: "write"
  attestations: "write"

env:
  ARTIFACT_NAME: "gen_emu_config_old-win-${{ github.sha }}"
  SCRIPT_BASE_DIR: "generate_emu_config_old"
  PACKAGE_BASE_DIR: "generate_emu_config_old/bin/win"

  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  build:
    runs-on: "windows-2022"

    steps:
      ### on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      # attest built artifact
      - name: "Generate artifact attestation"
        uses: actions/attest@v4
        with:
          subject-path: "${{ env.PACKAGE_BASE_DIR }}/${{ env.ARTIFACT_NAME }}"
